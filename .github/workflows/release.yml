name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Check plugin version matches tag
        run: |
          plugin_version=$(jq -r .version .claude-plugin/plugin.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$plugin_version" != "$tag_version" ]; then
            echo "::error::.claude-plugin/plugin.json version ($plugin_version) does not match release tag ($tag_version). Run 'make release-tag V=$tag_version' and push before tagging."
            exit 1
          fi

      - name: Check wrapper script syntax
        run: sh -n scripts/dogfetch.sh

      - name: Run tests
        run: go test -tags testseam -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # Avoid getting OOM killed. Lower to 1 if we get killed again.
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
